# Custom OpenShell network policy preset referenced by
# docs/openclaw.gateway.json5's plugins.entries.openshell.config.policy.
#
# This is a DRAFT, not yet applied anywhere — same status as the gateway
# config it pairs with. Written from NVIDIA's documented preset schema
# (docs.nvidia.com/nemoclaw/user-guide/openclaw/network-policy/configure-
# policies/create-custom-policy-presets.md), not tested against a live
# OpenShell instance — verify on the GB10 box before trusting it.
#
# Intent (PLAN.md 3.3): the sandbox reaches nothing outside itself.
# network_policies is deliberately empty — OpenShell denies by default,
# so an allowlist with zero entries means zero egress, full stop. There
# is no endpoint this agent legitimately needs to call: the six tools
# only shell out locally to the bearing_witness CLI (already outside
# the network policy's scope) and never make outbound HTTP/websocket/
# MCP calls themselves.
#
# Filesystem and tool-surface restrictions (workspaceAccess: "ro", the
# tools.sandbox.tools.deny group:fs/group:web/group:runtime list) live
# in openclaw.gateway.json5, not here — this file is network-only.
#
# Apply once the sandbox exists (per docs, --from-file/--from-dir need
# an existing sandbox in the local registry):
#   nemoclaw <sandbox-name> policy add --from-file docs/openshell.policy.bearing-witness-deny-egress.yaml --dry-run
#   nemoclaw <sandbox-name> policy add --from-file docs/openshell.policy.bearing-witness-deny-egress.yaml --yes
#
# To make it loadable by name instead of by path, copy it into the
# source catalog under nemoclaw-blueprint/policies/presets/ using this
# exact filename (must match preset.name below), then:
#   nemoclaw <sandbox-name> policy add bearing-witness-deny-egress --yes
#
# Verify after applying, don't just trust the file:
#   nemoclaw <sandbox-name> policy list
#   openclaw sandbox explain --agent <id> --json

preset:
  name: bearing-witness-deny-egress
  description: "Bearing Witness demo sandbox: zero outbound network access. The agent's six tools only shell out locally to the bearing_witness CLI; nothing it does legitimately needs the network."

network_policies: {}
